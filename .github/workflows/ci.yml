name: CI

on:
  push:
    branches: [main]
  pull_request:

# The jobs only read the repo, so the default token needs no write scopes.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      SKIP_ENV_VALIDATION: '1'
    steps:
      # Actions are pinned to commit SHAs so a moved tag cannot swap the code
      # this workflow runs. Bump by updating the SHA and the version comment.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Generated types in sync
        run: |
          pnpm --filter @astroload/cms generate:types
          git diff --exit-code

      - name: Lint (cms eslint)
        run: pnpm lint

      - name: Typecheck (cms tsc, web astro check)
        run: pnpm check

      - name: Test (web vitest)
        run: pnpm test
