# Local MongoDB for the astroload starter. Dev only, never production.
# Standalone mongod, no replica set: the CMS disables transactions
# (transactionOptions: false in cms/src/payload.config.ts), so a single
# node is enough. CMS and Astro run natively via
# `pnpm --filter @astroload/cms dev` and `pnpm --filter @astroload/web dev`.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    ports:
      - '27017:27017'
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodata:
