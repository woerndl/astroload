# Local MongoDB for the astroload starter. Dev only, never production.
# Standalone mongod, no replica set: the CMS disables transactions
# (transactionOptions: false in cms/src/payload.config.ts), so a single
# node is enough. CMS and Astro run natively via
# `pnpm --filter @astroload/cms dev` and `pnpm --filter @astroload/web dev`.
services:
  mongo:
    image: mongo:8
    restart: unless-stopped
    # Loopback only (this mongod has no auth), and a pinned host port to
    # renumber per project, like the web dev port: when several projects
    # keep the default, whichever container is up answers 27017 for all of
    # them, and a seed or SEED_FORCE aimed at this project reads or wipes
    # another one's data. A unique port fails with connection refused
    # instead. Keep DATABASE_URI in cms/.env on the same port and give each
    # project its own database name as the second guard.
    ports:
      - '127.0.0.1:27017:27017'
    volumes:
      - mongodata:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mongodata:
